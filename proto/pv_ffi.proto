// pico-view FFI control plane — the Dart <-> Rust boundary.
//
// The C ABI is frozen at four functions:
//
//   pv_init(api_data, send_port)             — once, at startup
//   pv_request(req, req_len) -> int32        — accept one PvRequest, answer later
//   pv_lcd_flush(rgba, len, w, h) -> int32   — hot path, stays raw
//   pv_close() -> int32                      — blocking tear-down
//
// pv_request never blocks on the device: it returns as soon as the request has
// been accepted (0) or found undecodable (-1). The answer arrives later on the
// pv_init SendPort as a PvEvent carrying a PvResponse whose `id` echoes the
// request's — so the caller correlates the two itself. Every accepted request
// is answered exactly once, including on timeout, so a caller waiting on an id
// is never left hanging.
//
// Device-originated payloads reuse the wire messages (picoview.wire.*) so the
// Rust layer forwards them without re-mapping.

syntax = "proto3";

package picoview.ffi;

import "pv_wire.proto";

// --- Requests ------------------------------------------------------------------

message PvRequest {
  // Correlation id, echoed on the matching PvResponse. Callers pick it (a
  // per-controller counter is enough — the engine only ever hands it back).
  // 0 means "no answer wanted": the request still runs, but nothing is posted.
  uint32 id = 1;
  // How long the engine may spend before answering ERROR_CODE_TIMEOUT.
  // 0 = the engine's default for this variant. Clamped to REQUEST_TIMEOUT_MAX.
  // Only meaningful for the variants that round-trip (open_device,
  // close_device, get_device_info); the rest answer immediately.
  uint32 timeout_ms = 2;

  oneof req {
    OpenDevice open_device = 3;
    CloseDevice close_device = 4;
    OtaStart ota_start = 5;

    // Forwarded to the device.
    picoview.wire.GetDeviceInfo get_device_info = 16;
    picoview.wire.SetParam set_param = 17;
    picoview.wire.Haptics haptics = 18;
  }
}

// Open the panel device and start a session. Round-trips: the `ack` is posted
// once the device is open and the panel initialized (up to ~10s), or
// ERROR_CODE_DEVICE when that fails, or ERROR_CODE_TIMEOUT if the worker did
// not get to it in time. A LinkEvent(CONNECTED) is posted alongside the `ack`.
message OpenDevice {
  // Nth enumerated device matching the pico-view VID/PID (ignored when `serial` is set).
  uint32 index = 1;
  // Panel model preset name, e.g. "st77916-round-360"; empty = default.
  string model = 2;
  // Select by USB serial instead of index; empty = use index.
  string serial = 3;
}

// Stop the worker and close the device. Round-trips: the `ack` is posted after
// teardown completes. Idempotent.
message CloseDevice {}

// Stream a signed ESP-IDF app image to the device and commit it. The `ack` is
// posted as soon as the transfer is *enqueued*; progress and the result arrive
// later as wire.OtaStatus events.
message OtaStart {
  bytes image = 1;
}

// --- Responses -------------------------------------------------------------------

// The answer to one PvRequest, delivered as a PvEvent on the pv_init SendPort.
message PvResponse {
  // Echoes PvRequest.id, so the caller knows which request this answers.
  uint32 id = 1;

  oneof resp {
    Ack ack = 2;
    Error error = 3;
    picoview.wire.DeviceInfo device_info = 4;
  }
}

message Ack {}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // Request decoded but is invalid (bad model name, empty image, ...).
  ERROR_CODE_BAD_REQUEST = 1;
  // open_device while a worker is running. Dart's hot-restart recovery relies
  // on this being distinct: close_device, then retry the open once.
  ERROR_CODE_ALREADY_OPEN = 2;
  // Device-dependent request with no device open.
  ERROR_CODE_NOT_OPEN = 3;
  // USB / device-setup failure.
  ERROR_CODE_DEVICE = 4;
  // Worker queue gone (engine shutting down).
  ERROR_CODE_ENQUEUE = 5;
  // This engine build doesn't know the request variant.
  ERROR_CODE_UNSUPPORTED = 6;
  ERROR_CODE_INTERNAL = 7;
  // A request/reply command got no answer before its deadline.
  ERROR_CODE_TIMEOUT = 8;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

// --- Events (Rust -> Dart, one encoded PvEvent per SendPort post) ------------------

enum LinkState {
  LINK_STATE_UNSPECIFIED = 0;
  // Attached and configured.
  LINK_STATE_CONNECTED = 1;
  // Lost (unplug / OTA reboot); the engine reconnects on its own.
  LINK_STATE_DISCONNECTED = 2;
}

// Posted on transitions only (the worker de-duplicates).
message LinkEvent {
  LinkState state = 1;
  // Reason for DISCONNECTED, for logs and the settings UI.
  string detail = 2;
  // Genuine-hardware result, meaningful only on CONNECTED: the device presented
  // a valid vendor-CA-signed certificate and answered the attestation challenge.
  bool verified = 3;
  // The attested device id (from the certificate). Meaningful only when
  // `verified`; empty otherwise.
  string device_id = 4;
  // The device's firmware version string (ESP-IDF app version, e.g. "1.4.0"),
  // as reported in the HELLO_ACK handshake. Meaningful only on CONNECTED.
  string fw_version = 5;
}

message PvEvent {
  oneof event {
    picoview.wire.Touch touch = 1;
    LinkEvent link = 2;
    picoview.wire.OtaStatus ota = 3;
    // The answer to an earlier pv_request; match it on PvResponse.id.
    PvResponse response = 4;
  }
}
